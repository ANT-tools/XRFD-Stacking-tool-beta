name: Inspect combined sync payload
on:
  push:
    branches: [release/v0.7.2-sync]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect combined payload
        run: |
          cat .sync/payload1.bin .sync/payload2.bin .sync/payload3.bin | base64 -d > /tmp/payload.xz
          echo "decoded bytes: $(wc -c </tmp/payload.xz)"
          file /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload
          echo "decompressed bytes: $(wc -c </tmp/payload)"
          file /tmp/payload
          python - <<'PY'
          import io, tarfile, zipfile
          from pathlib import Path
          p=Path('/tmp/payload'); data=p.read_bytes()
          try:
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as tf:
                  print('TAR CONTENTS:')
                  for m in tf.getmembers(): print(m.name, m.size)
          except Exception as e: print('not tar:',e)
          try:
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  print('ZIP CONTENTS:')
                  for i in zf.infolist(): print(i.filename,i.file_size)
          except Exception as e: print('not zip:',e)
          PY
